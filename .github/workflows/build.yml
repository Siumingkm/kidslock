name: Build TV Quiz Lock APK

on:
  push:
    branches: [main, master]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      # 仓库未提交 gradle wrapper 脚本，CI 内下载 Gradle 8.4 并直接用它构建
      - name: Install Gradle 8.4
        run: |
          GRADLE_VERSION=8.4
          curl -sL https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -o gradle.zip
          unzip -q gradle.zip
          mv gradle-${GRADLE_VERSION} gradle-dist

      - name: Build debug APK (默认 debug 密钥签名，可直接 sideload)
        run: ./gradle-dist/bin/gradle assembleDebug --no-daemon --stacktrace

      # app/build.gradle 开启了 ABI splits + universalApk，故产出为 app-universal-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-quiz-lock-apk
          path: app/build/outputs/apk/debug/app-universal-debug.apk

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-universal-debug.apk
